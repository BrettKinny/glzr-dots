# Machine-agnostic preferences. They live here rather than in %APPDATA% so
# both machines pick them up from git along with the keybindings.
onboarding = false

[ui]
agent_panel_sort = "spaces"
# One tab is not a choice, so don't spend a row saying so. New tabs still come
# from the keybinding, and the row returns as soon as there are two.
hide_tab_bar_when_single_tab = true

[ui.toast]
delivery = "herdr"

[theme]
name = "terminal"
auto_switch = false

[terminal]
default_shell = "pwsh"

# Shared keyboard language:
#   Alt   = Windows OS/window-manager actions (Super on Omarchy)
#   Ctrl, Ctrl+Shift = the focused application (ttt)
#   Ctrl+Alt = Herdr
#   Shift = move, reverse, or the higher-level variant
# F9 keeps Herdr's prefix commands available as compatibility fallbacks.
[keys]
prefix = "f9"

# Application navigation and discovery.
help = ["ctrl+alt+?", "prefix+?"]
# P for palette: type to jump.
goto = ["ctrl+alt+p", "prefix+g"]
workspace_picker = "prefix+w"
# J for jump: pane behind the latest notification.
open_notification_target = ["ctrl+alt+j", "prefix+o"]
toggle_sidebar = ["ctrl+alt+b", "prefix+b"]
detach = ["ctrl+alt+q", "prefix+q"]

new_tab = ["ctrl+alt+t", "prefix+c"]
previous_tab = "prefix+p"
next_tab = "prefix+n"
# Plain prefix+digits go to sidebar agents (focus_agent); tabs are rarely >1.
switch_tab = "prefix+shift+1..9"
rename_tab = "prefix+shift+t"
close_tab = "prefix+shift+x"

# Workspaces stack vertically in the sidebar, so Ctrl+Alt+up/down walks them.
new_workspace = ["ctrl+alt+n", "prefix+shift+n"]
# Worktree = workspace + branch checkout; G as in ttt's git view.
new_worktree = ["ctrl+alt+g", "prefix+shift+g"]
# No herdr default. Attaches an on-disk worktree that isn't a live workspace yet
# (goto only reaches existing ones). prefix+shift+o avoids default prefix+o.
open_worktree = ["ctrl+alt+o", "prefix+shift+o"]
next_workspace = ["ctrl+alt+down", "prefix+tab"]
previous_workspace = ["ctrl+alt+up", "prefix+shift+tab"]
rename_workspace = ["ctrl+alt+r", "prefix+shift+w"]
close_workspace = "prefix+shift+d"

# Nth agent in the sidebar list.
# WT cannot encode Ctrl+Alt+digit, so it sends prefix+digit instead.
focus_agent = ["ctrl+alt+1..9", "prefix+1..9"]

# Ctrl+arrows stay with the app (word-jump in ttt and shells); Ctrl+Alt+←/→ matches
# Zen's workspace hop. Ctrl+Alt+↑/↓ walk workspaces, so pane up/down and swaps are prefix-only.
focus_pane_left = ["ctrl+alt+left", "prefix+h"]
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = ["ctrl+alt+right", "prefix+l"]
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"

# Pane lifecycle and layout. Zoom is rare enough to live on the prefix alone.
close_pane = ["ctrl+alt+w", "prefix+x"]
split_vertical = ["ctrl+alt+backslash", "prefix+v"]
split_horizontal = ["ctrl+alt+minus", "prefix+minus"]
zoom = "prefix+z"
resize_mode = "prefix+r"

# Foot's URL mode. Herdr owns the screen, so Windows Terminal's mark-mode link
# hopping can't see pane output; read it via the API instead. U for URL.
[[keys.command]]
key = "ctrl+alt+u"
type = "popup"
command = "pwsh -NoProfile -File \"%USERPROFILE%\\.glzr\\herdr\\url-picker.ps1\""
width = "80%"
height = "50%"

[[keys.command]]
key = "prefix+u"
type = "popup"
command = "pwsh -NoProfile -File \"%USERPROFILE%\\.glzr\\herdr\\url-picker.ps1\""
width = "80%"
height = "50%"

# herdr-sidebar plugin (explorer + git); again focuses, then closes. S for sidebar.
[[keys.command]]
key = "ctrl+alt+s"
type = "shell"
command = "herdr plugin action invoke open-sidebar-windows --plugin herdr-sidebar"

# Side ttt (explorer + git Changes) for this tab; again toggles focus back. E for explorer.
[[keys.command]]
key = "prefix+e"
type = "shell"
command = "pwsh -NoProfile -NonInteractive -File \"%USERPROFILE%\\.glzr\\herdr\\ttt-side.ps1\""
