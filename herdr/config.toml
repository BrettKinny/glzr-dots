# Machine-agnostic preferences. They live here rather than in %APPDATA% so
# both machines pick them up from git along with the keybindings.
onboarding = false

[ui]
agent_panel_sort = "spaces"
# One tab is not a choice, so don't spend a row saying so. New tabs still come
# from the keybinding, and the row returns as soon as there are two.
hide_tab_bar_when_single_tab = true

[ui.toast]
delivery = "herdr"

[theme]
name = "terminal"
auto_switch = false

[terminal]
default_shell = "pwsh"

# Shared keyboard language:
#   Alt   = Windows OS/window-manager actions (Super on Omarchy)
#   Ctrl  = immediate actions in the focused application
#   Shift = move, reverse, or the higher-level variant
# F12 keeps Herdr's prefix commands available as compatibility fallbacks.
[keys]
prefix = "f12"

# Application navigation and discovery.
help = ["ctrl+?", "prefix+?"]
goto = ["ctrl+g", "prefix+g"]
workspace_picker = "prefix+w"
# Plain Ctrl+B belongs to Fresh's editing layer; Shift lifts it to Herdr's UI.
toggle_sidebar = ["ctrl+shift+b", "prefix+b"]
detach = ["ctrl+shift+q", "prefix+q"]

# Plain Ctrl+T/W belong to Fresh's editing layer; Shift lifts them to Herdr.
new_tab = ["ctrl+shift+t", "prefix+c"]
previous_tab = "prefix+p"
next_tab = "prefix+n"
switch_tab = ["ctrl+1..9", "prefix+1..9"]
rename_tab = "prefix+shift+t"
close_tab = "prefix+shift+x"

# Workspaces are the next level above tabs, so Ctrl+Tab cycles them.
new_workspace = ["ctrl+shift+n", "prefix+shift+n"]
# Worktree = workspace + branch checkout; Shift lifts Ctrl+G (go to) to create.
new_worktree = ["ctrl+shift+g", "prefix+shift+g"]
# No herdr default. Attaches an on-disk worktree that isn't a live workspace yet
# (goto only reaches existing ones). prefix+shift+o avoids default prefix+o.
open_worktree = ["ctrl+shift+o", "prefix+shift+o"]
next_workspace = ["ctrl+tab", "prefix+tab"]
previous_workspace = ["ctrl+shift+tab", "prefix+shift+tab"]
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"

# Ctrl+arrows take pane focus back from Fresh's word-jump. Ctrl+Shift+arrows
# stay with Fresh (add-cursor, word-select), so swaps remain prefix-only.
focus_pane_left = ["ctrl+left", "prefix+h"]
focus_pane_down = ["ctrl+down", "prefix+j"]
focus_pane_up = ["ctrl+up", "prefix+k"]
focus_pane_right = ["ctrl+right", "prefix+l"]
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"

# Pane lifecycle and layout. Zoom is rare enough to live on the prefix alone.
close_pane = ["ctrl+shift+w", "prefix+x"]
split_vertical = ["ctrl+backslash", "prefix+v"]
split_horizontal = ["ctrl+shift+backslash", "prefix+minus"]
zoom = "prefix+z"
resize_mode = "prefix+r"
