# Machine-agnostic preferences. They live here rather than in %APPDATA% so
# both machines pick them up from git along with the keybindings.
onboarding = false

[ui]
agent_panel_sort = "spaces"
# One tab is not a choice, so don't spend a row saying so. New tabs still come
# from the keybinding, and the row returns as soon as there are two.
hide_tab_bar_when_single_tab = true

[ui.toast]
delivery = "herdr"

[theme]
name = "terminal"
auto_switch = false

[terminal]
default_shell = "pwsh"

# Shared keyboard language:
#   Alt   = Windows OS/window-manager actions (Super on Omarchy)
#   Ctrl  = immediate actions in the focused application
#   Shift = move, reverse, or the higher-level variant
# F9 keeps Herdr's prefix commands available as compatibility fallbacks.
[keys]
prefix = "f9"

# Application navigation and discovery.
help = ["ctrl+?", "prefix+?"]
# P for palette: type to jump.
goto = ["ctrl+shift+p", "prefix+g"]
workspace_picker = "prefix+w"
# J for jump: pane behind the latest notification.
open_notification_target = ["ctrl+shift+j", "prefix+o"]
# Plain Ctrl+B belongs to ttt's sidebar; Shift lifts it to Herdr's UI.
toggle_sidebar = ["ctrl+shift+b", "prefix+b"]
detach = ["ctrl+shift+q", "prefix+q"]

# Plain Ctrl+T belongs to ttt's terminal; Shift lifts it to Herdr.
new_tab = ["ctrl+shift+t", "prefix+c"]
previous_tab = "prefix+p"
next_tab = "prefix+n"
# Ctrl+digits go to sidebar agents (focus_agent); tabs are rarely >1.
switch_tab = "prefix+1..9"
rename_tab = "prefix+shift+t"
close_tab = "prefix+shift+x"

# Workspaces are the next level above tabs, so Ctrl+Tab cycles them.
new_workspace = ["ctrl+shift+n", "prefix+shift+n"]
# Worktree = workspace + branch checkout; Shift lifts Ctrl+G (go to) to create.
new_worktree = ["ctrl+shift+g", "prefix+shift+g"]
# No herdr default. Attaches an on-disk worktree that isn't a live workspace yet
# (goto only reaches existing ones). prefix+shift+o avoids default prefix+o.
open_worktree = ["ctrl+shift+o", "prefix+shift+o"]
next_workspace = ["ctrl+tab", "prefix+tab"]
previous_workspace = ["ctrl+shift+tab", "prefix+shift+tab"]
rename_workspace = ["ctrl+shift+r", "prefix+shift+w"]
close_workspace = "prefix+shift+d"

# Nth agent in the sidebar list.
focus_agent = "ctrl+1..9"

# Ctrl+arrows stay with the app (word-jump in ttt and shells); Ctrl+Alt+←/→ matches
# Zen's workspace hop. Up/down are prefix-only: Ctrl+Alt+↑/↓ is ttt's move-line.
# Ctrl+Shift+arrows stay with ttt (add-cursor, word-select), so swaps remain prefix-only.
focus_pane_left = ["ctrl+alt+left", "prefix+h"]
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = ["ctrl+alt+right", "prefix+l"]
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"

# Pane lifecycle and layout. Zoom is rare enough to live on the prefix alone.
close_pane = ["ctrl+shift+w", "prefix+x"]
split_vertical = ["ctrl+shift+backslash", "prefix+v"]
split_horizontal = ["ctrl+shift+minus", "prefix+minus"]
zoom = "prefix+z"
resize_mode = "prefix+r"

# Foot's URL mode. Herdr owns the screen, so Windows Terminal's mark-mode link
# hopping can't see pane output; read it via the API instead. U for URL.
[[keys.command]]
key = "ctrl+shift+u"
type = "popup"
command = "pwsh -NoProfile -File \"%USERPROFILE%\\.glzr\\herdr\\url-picker.ps1\""
width = "80%"
height = "50%"

[[keys.command]]
key = "prefix+u"
type = "popup"
command = "pwsh -NoProfile -File \"%USERPROFILE%\\.glzr\\herdr\\url-picker.ps1\""
width = "80%"
height = "50%"

# Side ttt (explorer + git Changes) for this tab; again toggles focus back. E for explorer.
[[keys.command]]
key = "ctrl+shift+e"
type = "shell"
command = "pwsh -NoProfile -NonInteractive -File \"%USERPROFILE%\\.glzr\\herdr\\ttt-side.ps1\""

[[keys.command]]
key = "prefix+e"
type = "shell"
command = "pwsh -NoProfile -NonInteractive -File \"%USERPROFILE%\\.glzr\\herdr\\ttt-side.ps1\""
