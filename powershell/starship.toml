# Starship prompt config for glzr-dots.
# Loaded via $env:STARSHIP_CONFIG in ./profile.ps1.
#
# Deliberately near-stock: starship's built-in defaults already style every
# module with *named* ANSI colours ("cyan bold", "bold purple", "red bold",
# "bold green") rather than hex, so the prompt inherits whatever palette the
# terminal is running. Keep it that way — use ANSI names, not "#rrggbb", or the
# prompt stops tracking the Windows Terminal / Zebar theme.
#
# Named colours available: black red green yellow blue purple cyan white
# plus a bright- prefix for each (e.g. "bright-black" for a dim/comment tone).
#
# Inspect any module's effective settings with:  starship print-config <module>
# Profile a slow prompt with:                    starship timings
#
# Editor schema hint. Any prompt-level key (format, add_newline, palette,
# follow_symlinks) must live up here, above every [table]: in TOML a bare key
# belongs to whatever table precedes it, so parked lower down it silently
# becomes a key of that table and starship warns "Unknown key".
"$schema" = 'https://starship.rs/config-schema.json'

# Note: right_format (right-aligned prompt) is NOT supported in PowerShell —
# only elvish, fish, zsh, xonsh, cmd, nushell and bash. The old oh-my-posh
# right-hand "in pwsh at HH:MM:SS" block has no equivalent here; cmd_duration
# on the main line covers the useful half of it.

# --- Hand-written config ----------------------------------------------------

# Surface the actual exit code on failure. The `character` module already goes
# red, but Windows hands back codes worth reading (e.g. -1073741819 = access
# violation), so print it. Terse on purpose: renders as "✘ 1", and nothing at
# all on success. ✘ over starship's default ❌ emoji, which forces its own
# colour and so ignores the terminal theme.
[status]
disabled = false
symbol = "✘ "
style = "bold red"

# Show the wall-clock time the prompt was drawn (off by default).
# [time]
# disabled = false

# Prompt cost on this machine, measured (warm, 10 reps, avg):
#   non-git directory ......  41 ms   (~34 ms of that is just spawning the exe)
#   inside a git repo ...... 269 ms
# All of the difference is starship's git work. Disabling git_status claws back
# ~68 ms; the remaining ~160 ms is repo-root discovery, which any git segment
# triggers, so it can't be tuned away without dropping git from the prompt.
# (For reference, oh-my-posh managed the same repo in ~130 ms.)
# [git_status]
# disabled = true

# If you ever append a preset (e.g. `starship preset nerd-font-symbols`), note
# that presets declare their own [tables] and lead with a bare "$schema" key.
# TOML forbids a repeated table, and starship's response to a parse error is to
# discard the WHOLE file and silently fall back to stock defaults — so delete
# any table the preset duplicates, and verify with: starship print-config
