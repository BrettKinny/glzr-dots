# yaml-language-server / editor schema hint. MUST stay above every [table]:
# in TOML a bare key belongs to whatever table precedes it, so parked lower down
# it silently becomes a key of that table and starship warns "Unknown key".
# Same rule applies to any prompt-level key you add (format, add_newline,
# follow_symlinks, palette) — those all belong up here, not below a [table].
"$schema" = 'https://starship.rs/config-schema.json'
# Starship prompt config for glzr-dots.
# Loaded via $env:STARSHIP_CONFIG in ../powershell/profile.ps1.
#
# Deliberately near-stock: starship's built-in defaults already style every
# module with *named* ANSI colours ("cyan bold", "bold purple", "red bold",
# "bold green") rather than hex, so the prompt inherits whatever palette the
# terminal is running. Keep it that way — use ANSI names, not "#rrggbb", or the
# prompt stops tracking the Windows Terminal / Zebar theme.
#
# Named colours available: black red green yellow blue purple cyan white
# plus a bright- prefix for each (e.g. "bright-black" for a dim/comment tone).
#
# Inspect any module's effective settings with:  starship print-config <module>
# Profile a slow prompt with:                    starship timings

# Note: right_format (right-aligned prompt) is NOT supported in PowerShell —
# only elvish, fish, zsh, xonsh, cmd, nushell and bash. The old oh-my-posh
# right-hand "in pwsh at HH:MM:SS" block has no equivalent here; cmd_duration
# on the main line covers the useful half of it.

# --- Hand-written config ----------------------------------------------------

# Surface the actual exit code on failure. The `character` module already goes
# red, but Windows hands back codes worth reading (e.g. -1073741819 = access
# violation), so print it. Terse on purpose: renders as " 1", and nothing
# at all on success. The glyph is the Nerd Font X the preset below would have
# used, moved up here — see the banner note about duplicate tables. Chosen over
# starship's default emoji, which forces its own colour and ignores the theme.
[status]
disabled = false
symbol = " "
style = "bold red"

# Show the wall-clock time the prompt was drawn (off by default).
# [time]
# disabled = false

# Prompt cost on this machine, measured (warm, 10 reps, avg):
#   non-git directory ......  41 ms   (~34 ms of that is just spawning the exe)
#   inside a git repo ...... 269 ms
# All of the difference is starship's git work. Disabling git_status claws back
# ~68 ms; the remaining ~160 ms is repo-root discovery, which any git segment
# triggers, so it can't be tuned away without dropping git from the prompt.
# (For reference, oh-my-posh managed the same repo in ~130 ms.)
# [git_status]
# disabled = true

# =============================================================================
# GENERATED BLOCK — nerd-font-symbols preset
# =============================================================================
# Everything below is the output of:  starship preset nerd-font-symbols
# It only swaps each module's `symbol` for a Nerd Font glyph; it sets no colours,
# so the ANSI theme inheritance above still holds.
#
# To refresh after a starship upgrade, regenerate and re-append:
#   starship preset nerd-font-symbols -o nf.toml
# Edits inside this block will be lost if you do that — put your own overrides
# ABOVE the banner instead, where they'll survive.
#
# GOTCHA: TOML forbids declaring the same table twice, and starship's response
# to a parse error is to discard the WHOLE file and fall back to stock defaults,
# silently apart from one line on stderr. So if you override a module up top
# that the preset also touches, delete the preset's copy down here. That has
# already been done for [status]. Verify any edit with: starship print-config
# =============================================================================

