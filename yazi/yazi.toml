# Text/config files → ttt inline. With reuseWindow on, ttt forwards to an already-open
# ttt (standalone window or herdr pane) and exits at once, so yazi comes straight back.
[opener]
edit = [
	{ run = "ttt %s", block = true, desc = "ttt" },
]

# Bulk rename reads the list back when the editor exits; a forwarding ttt exits at
# once, so nothing would be renamed. Force a private instance.
[[opener.bulk-rename]]
run   = "ttt --new-window %s"
block = true

[[open.prepend_rules]]
url = "bulk-rename.txt"
use = "bulk-rename"

# git.yazi: status markers in the file list
[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"

# plugins/glow.yazi (local)
[[plugin.prepend_previewers]]
url = "*.md"
run = "glow"
