[mgr]
prepend_keymap = [
	# Same key as Zen/ttt. Quits on the last tab, like the default <C-c>.
	{ on = "<C-t>", run = "tab_create --current", desc = "New tab here" },
	{ on = "<C-w>", run = "close", desc = "Close tab" },
	{ on = "<C-g>", run = 'shell "lazygit" --block', desc = "lazygit here" },
	{ on = "!", run = 'shell "pwsh -NoLogo" --block', desc = "pwsh here" },
	{ on = "T", run = "plugin toggle-pane max-preview", desc = "Maximise or restore the preview" },
	{ on = "<C-b>", run = "plugin toggle-pane min-parent", desc = "Hide or show the parent pane" },
	{ on = "<S-Up>", run = "seek -5", desc = "Scroll preview up" },
	{ on = "<S-Down>", run = "seek 5", desc = "Scroll preview down" },
	{ on = [ "g", "w" ], run = 'cd "~/Work Notes"', desc = "Go to Work Notes" },
	{ on = [ "g", "v" ], run = 'cd ~/dev', desc = "Go to dev" },
	{ on = [ "g", "o" ], run = 'cd "~/OneDrive - MULTINAIL AUSTRALIA PTY LTD"', desc = "Go to OneDrive" },
	# Ctrl+Insert is what Alt+C sends (glazewm/clipboard.py). Sets a file-drop list, so
	# it pastes as files into Explorer/Outlook/Teams. %s = hovered when nothing's selected.
	{ on = "<C-Insert>", run = '''shell -- pwsh -NoProfile -cwa "Add-Type -A System.Windows.Forms; $c = [Collections.Specialized.StringCollection]::new(); $c.AddRange([string[]]$args); [Windows.Forms.Clipboard]::SetFileDropList($c)" %s''', desc = "Copy as files to Windows clipboard" },
]
